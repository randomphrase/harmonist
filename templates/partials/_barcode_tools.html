{% from 'macros.html' import reload_unless_retargeted %}
{% set on_album = on_album_page | default(false) %}
{% if album.barcode %}
<div class="flex gap-2 flex-wrap mb-3">
    <button hx-post="/manual/{{ album.id }}/barcode"
            hx-target="#mbid-results-{{ album.id }}" hx-swap="innerHTML"
            hx-disabled-elt="this" hx-indicator="#tagging-{{ album.id }}"
            hx-vals='{"on_album_page": "{{ 'true' if on_album else 'false' }}"}'
            {{ reload_unless_retargeted(on_album) }}
            title="Look up the embedded barcode on MusicBrainz; any match needs review."
            class="px-3 py-1.5 bg-white hover:bg-surface text-ink border border-line rounded text-xs font-bold uppercase tracking-widest transition">
        Look up barcode
    </button>
    <a href="{{ harmony_base }}/release?gtin={{ album.barcode|urlencode }}&amp;qobuz=&amp;deezer="
       target="_blank" rel="noopener" class="text-xs text-accent hover:underline self-center">
        Find barcode in Harmony ↗
    </a>
</div>
{% endif %}
