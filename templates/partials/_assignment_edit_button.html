<button {% if panel and has_suggestion|default(false) %}type="submit" name="assignment_action" value="edit"
        {% else %}type="button" hx-get="{{ review_url('/assignments/' ~ album.id ~ '?on_album_page=' ~ ('true' if on_album_page else 'false'), review) }}"
        hx-target="closest .assignment-content" hx-swap="outerHTML" hx-disabled-elt="this"{% endif %}
        class="px-3 py-1.5 bg-white hover:bg-surface text-ink border border-line rounded text-xs font-bold uppercase tracking-widest transition">Edit track assignments</button>
