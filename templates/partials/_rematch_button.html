<button type="button" hx-post="/library/{{ album.id }}/rematch"
        hx-swap="none" hx-disabled-elt="this"
        hx-on::after-request="if (event.detail.successful) window.location.href = '/'"
        hx-confirm="Wrong MusicBrainz release? The album goes back to Needs MBID so you can pick the correct one. Your files keep their current tags until you re-tag."
        title="Wrong MusicBrainz match — pick the correct release"
        aria-label="Wrong MusicBrainz match — pick the correct release"
        class="inline-flex items-center justify-center w-5 h-5 rounded-full text-muted hover:text-mb-purple hover:bg-mb-purple/10 transition">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/>
    </svg>
</button>
