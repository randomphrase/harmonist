{# A release reviewed without being stored — a sibling from the release group
   check, or one the user chose (#933) — is left by closing its review. #}
<button type="button" onclick="this.closest('dialog').close()"
        class="px-3 py-1.5 bg-white hover:bg-surface text-ink border border-line rounded text-xs font-bold uppercase tracking-widest transition">Cancel</button>
