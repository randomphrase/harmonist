{% if panel %}
{% if replacement or album.sidecar.mb_match_candidate %}
<button {% if actions_disabled|default(false) %}disabled{% endif %} type="button" hx-post="{{ review_url('/confirm/' ~ album.id ~ '/accept', replacement) }}" hx-include="closest form"
        {% if not on_album_page %}hx-sync="body:queue last"{% endif %}
        hx-target="#assignment-error-{{ album.id }}-{{ candidate.mb_release_id }}" hx-swap="none" hx-disabled-elt="this"
        hx-indicator="#assignment-progress-{{ album.id }}"
        class="disabled:opacity-40 disabled:cursor-not-allowed px-3 py-1.5 bg-accent hover:bg-accent-dark text-white rounded text-xs font-bold uppercase tracking-widest transition">
    Confirm suggestion
</button>
{% endif %}
{% endif %}
{% if replacement %}
{% if not actions_disabled|default(false) %}
{% include 'partials/_contribution_back.html' %}
{% endif %}
{% elif album.sidecar.mb_match_candidate %}
<button {% if actions_disabled|default(false) %}disabled{% endif %} type="button" hx-post="/reject/{{ album.id }}" hx-swap="none" hx-disabled-elt="this"
        {{ reload_on_success(on_album_page) }}
        title="Clear this suggestion. The album stays here so you can assign a different release or recheck."
        class="disabled:opacity-40 disabled:cursor-not-allowed px-3 py-1.5 bg-white hover:bg-surface text-ink border border-line rounded text-xs font-bold uppercase tracking-widest transition">Dismiss suggestion</button>
{% endif %}
