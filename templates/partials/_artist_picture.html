<span aria-hidden="true" class="{{ picture_class }} bg-surface text-muted border border-line rounded">
    <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
    </svg>
    {% if artist.artwork_path %}
    <img src="{{ artists_view.image_urls[artist.key] }}" alt="" loading="lazy"
         onerror="this.style.visibility='hidden'"
         class="absolute inset-0 w-full h-full object-cover rounded bg-surface">
    {% endif %}
</span>
